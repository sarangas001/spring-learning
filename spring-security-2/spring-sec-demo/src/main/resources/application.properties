spring.application.name=spring-sec-demo


#spring.security.user.name=root
#spring.security.user.password=root

server.servlet.session.cookie.same-site=strict

# Security debugging (shows which filter handled/rejected each request)
logging.level.org.springframework.security=DEBUG
spring.datasource.url=jdbc:mysql://localhost:3306/teluskodb
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.lazy_load_no_trans=true