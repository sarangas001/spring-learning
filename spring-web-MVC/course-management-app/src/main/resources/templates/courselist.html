<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 28px;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
        }

        .add-btn {
            display: inline-block;
            padding: 12px 18px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        thead {
            background: #eff6ff;
        }

        th {
            padding: 16px 14px;
            text-align: left;
            font-size: 13px;
            color: #1e40af;
            text-transform: uppercase;
        }

        td {
            padding: 16px 14px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }

        tbody tr {
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .delete-form {
            margin: 0;
        }

        .delete-btn {
            padding: 8px 13px;
            background: #fee2e2;
            color: #b91c1c;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .delete-btn:hover {
            background: #fecaca;
        }

        .empty {
            text-align: center;
            padding: 35px;
            color: #64748b;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }

            .card {
                padding: 20px 15px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            h1 {
                font-size: 23px;
            }

            .add-btn {
                width: 100%;
                text-align: center;
            }

            th, td {
                padding: 12px 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="header">
            <div>
                <h1>Course Management</h1>
                <p class="subtitle">
                    Manage all your registered courses in one place.
                </p>
            </div>

            <a th:href="@{/course-form}" class="add-btn">
                + Add New Course
            </a>
        </div>

        <div class="table-wrapper">

            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Course Name</th>
                    <th>Trainer Name</th>
                    <th>Duration</th>
                    <th>Fees (LKR)</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="course : ${courses}">
                    <td th:text="${course.id}"></td>
                    <td th:text="${course.courseName}"></td>
                    <td th:text="${course.trainerName}"></td>
                    <td th:text="${course.duration} + ' Months'"></td>
                    <td th:text="${course.fees}"></td>

                    <td>
                        <form
                                class="delete-form"
                                th:action="@{/update-course}"
                                method="GET"
                                onsubmit="return confirm('Are you sure you want to update this course?');">
                            <input type="hidden" name="id" th:value="${course.id}"/>
                            <button type="submit" class="delete-btn">
                                Update
                            </button>

                        </form>
                        <form
                                class="delete-form"
                                th:action="@{/delete-course?id=${course.id}}"
                                method="GET"
                                onsubmit="return confirm('Are you sure you want to delete this course?');">
                            <input type="hidden" name="id" th:value="${course.id}"/>
                            <button type="submit" class="delete-btn">
                                Delete
                            </button>

                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(courses)}">
                    <td colspan="6" class="empty">
                        No courses available. Add your first course!
                    </td>
                </tr>
                </tbody>
            </table>

        </div>

        <a th:href="@{/course-form}" class="back-link">
            ← Back to Register Course
        </a>

    </div>

</div>

</body>
</html>
