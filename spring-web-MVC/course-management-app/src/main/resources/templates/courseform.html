
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Course</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 550px;
        }

        .card {
            background: #ffffff;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
        }

        h1 {
            font-size: 28px;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        input::placeholder {
            color: #94a3b8;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #2563eb;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
                align-items: flex-start;
            }

            .card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Register Course</h1>

        <p class="subtitle">
            Enter the course details below to register a new course.
        </p>

        <form th:action="@{/register-course}"
              th:object="${course}"
              method="post">

            <div class="form-group">
                <label for="courseName">Course Name</label>

                <input type="text"
                       id="courseName"
                       th:field="*{courseName}"
                       placeholder="Enter course name"
                       required>
            </div>

            <div class="form-group">
                <label for="trainerName">Trainer Name</label>

                <input type="text"
                       id="trainerName"
                       th:field="*{trainerName}"
                       placeholder="Enter trainer name"
                       required>
            </div>

            <div class="form-group">
                <label for="duration">Duration (Months)</label>

                <input type="number"
                       id="duration"
                       th:field="*{duration}"
                       placeholder="Enter duration in months"
                       min="1"
                       required>
            </div>

            <div class="form-group">
                <label for="fees">Course Fees (LKR)</label>

                <input type="number"
                       id="fees"
                       th:field="*{fees}"
                       placeholder="Enter course fees"
                       min="0"
                       step="0.01"
                       required>
            </div>

            <button type="submit" class="btn">
                Register Course
            </button>
            <a th:href="@{/courselist}" class="back-link">Cancel</a>

        </form>

        <a th:href="@{/courseslist}" class="back-link">
            ← View All Courses
        </a>

    </div>

</div>

</body>
</html>
