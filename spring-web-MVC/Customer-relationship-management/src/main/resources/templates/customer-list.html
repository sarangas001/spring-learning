<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 35px 20px;
            color: #243047;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #68758a;
            margin-bottom: 25px;
        }

        .top-bar, .search-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        input {
            padding: 11px 13px;
            border: 1px solid #d5dce7;
            border-radius: 6px;
            font-size: 14px;
        }

        .search-form input {
            flex: 1;
            min-width: 180px;
        }

        .btn {
            padding: 11px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .secondary {
            background: #e7edf7;
            color: #243047;
        }

        .edit {
            background: #e0edff;
            color: #1d4ed8;
        }

        .delete {
            background: #fee2e2;
            color: #b91c1c;
        }

        .table-wrapper {
            background: white;
            border-radius: 10px;
            overflow-x: auto;
            box-shadow: 0 4px 18px #2430470d;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #edf0f5;
        }

        th {
            background: #f8fafc;
            color: #526078;
            font-size: 13px;
        }

        td {
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .empty {
            text-align: center;
            padding: 35px;
            color: #68758a;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            .top-bar .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Customer Management</h1>
    <p class="subtitle">Manage your customers in one place.</p>

    <div class="top-bar">
        <a th:href="@{/customerform}" class="btn primary">
            + Add Customer
        </a>
    </div>

    <form class="search-form"
          th:action="@{/searchcustomernameemail}"
          method="post">

        <input type="text"
               name="name"
               placeholder="Search by customer name">

        <input type="text"
               name="email"
               placeholder="Search by email">

        <button type="submit" class="btn primary">
            Search
        </button>

        <a th:href="@{/customerlist}"
           class="btn secondary">
            Clear
        </a>
    </form>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Company</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="customer : ${customers}">
                <td th:text="${customer.id}"></td>
                <td th:text="${customer.name}"></td>
                <td th:text="${customer.email}"></td>
                <td th:text="${customer.phone}"></td>
                <td th:text="${customer.company}"></td>

                <td>
                    <div class="actions">
                        <a th:href="@{/updateform(id=${customer.id})}"
                           class="btn edit">
                            Edit
                        </a>

                        <a th:href="@{/deletecustomer(id=${customer.id})}"
                           class="btn delete"
                           onclick="return confirm('Are you sure you want to delete this customer?')">
                            Delete
                        </a>
                    </div>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(customers)}">
                <td colspan="6" class="empty">
                    No customers found.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
