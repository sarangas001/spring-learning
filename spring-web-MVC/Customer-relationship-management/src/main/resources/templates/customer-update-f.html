<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Customer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 35px 15px;
            color: #243047;
        }

        .form-container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 25px #24304710;
        }

        h1 {
            margin-top: 0;
        }

        .subtitle {
            color: #68758a;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5dce7;
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            font-size: 14px;
        }

        .submit {
            background: #2563eb;
            color: white;
            flex: 1;
        }

        .cancel {
            background: #e7edf7;
            color: #243047;
        }
    </style>
</head>

<body>

<div class="form-container">

    <h1>Update Customer</h1>
    <p class="subtitle">Update the existing customer details.</p>

    <form th:action="@{/updatecustomer}"
          th:object="${customer}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label for="name">Customer Name</label>
            <input type="text" id="name"
                   th:field="*{name}" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email"
                   th:field="*{email}" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone"
                   th:field="*{phone}">
        </div>

        <div class="form-group">
            <label for="company">Company</label>
            <input type="text" id="company"
                   th:field="*{company}">
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <textarea id="address"
                      th:field="*{address}"
                      rows="3"></textarea>
        </div>

        <div class="buttons">
            <button type="submit" class="btn submit">
                Update Customer
            </button>

            <a th:href="@{/customerlist}" class="btn cancel">
                Cancel
            </a>
        </div>

    </form>

</div>

</body>
</html>
